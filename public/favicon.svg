<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <rect width="32" height="32" rx="8" fill="#2563eb"/>

  <!-- Center pole -->
  <rect x="15" y="7" width="2" height="18" rx="1" fill="white"/>

  <!-- Base -->
  <rect x="10" y="24" width="12" height="2.5" rx="1.25" fill="white"/>

  <!-- Top bar (balance beam) -->
  <rect x="6" y="11" width="20" height="2" rx="1" fill="white"/>

  <!-- Left pan (slightly lower = discrepancy) -->
  <line x1="8" y1="13" x2="8" y2="17.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="5" y="17.5" width="6" height="2" rx="1" fill="#93c5fd"/>

  <!-- Right pan (higher) -->
  <line x1="24" y1="13" x2="24" y2="15.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="21" y="15.5" width="6" height="2" rx="1" fill="#93c5fd"/>

  <!-- Small dot at pivot -->
  <circle cx="16" cy="11" r="1.5" fill="#bfdbfe"/>
</svg>
